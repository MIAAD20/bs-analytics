services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: bsuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: bsanalytics
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bsuser -d bsanalytics"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://bsuser:${POSTGRES_PASSWORD}@postgres:5432/bsanalytics
      REDIS_URL: redis://redis:6379/0
      ICON_CACHE_DIR: /srv/cache/icons
      # The official API serves only the top 200 entries of the player
      # rankings (deeper position cursors return empty pages), so 200 is
      # the honest maximum.
      LEADERBOARD_TOP_N: 200
    volumes:
      - icon_cache:/srv/cache/icons
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  icon_cache:
